<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FinalV1 - Lithology Report</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://js.arcgis.com/4.31/"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f0f0f0;
}

#controls {
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background: #fff;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 1000px;
    box-sizing: border-box;
}

#controls label {
    font-size: 14px;
    font-weight: bold;
    color: #333;
}

#titleInput {
    padding: 6px 10px;
    font-size: 14px;
    width: 320px;
    border: 1px solid #888;
    border-radius: 3px;
}

button {
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    background: #005e95;
    color: white;
    border: none;
    border-radius: 3px;
    font-weight: bold;
}

button:hover {
    background: #004b78;
}

button:disabled {
    cursor: wait;
    opacity: 0.6;
}

/* Single Page Dashboard Layout */
#report {
    width: 1000px;
}

.pdf-page {
    box-sizing: border-box;
    width: 1000px;
    height: 750px;
    padding: 14px;
    background: white;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.report-header {
    height: 26px;
    font-size: 16px;
    font-weight: bold;
    flex: none;
    display: flex;
    align-items: center;
    border-bottom: 2px solid #333;
    padding-bottom: 2px;
}

/* Middle Row: Charts (Left) & Index Map (Right) */
.middle-row {
    display: flex;
    gap: 10px;
    height: 340px;
    flex: none;
}

.charts-container {
    flex: 1;
    border: 1px solid #bbb;
    background: #fafafa;
    padding: 6px;
    box-sizing: border-box;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-content: flex-start;
}

.index-map-wrapper {
    width: 290px;
    border: 1px solid #bbb;
    position: relative;
    background: #e8e8e8;
    box-sizing: border-box;
}

/* Bottom Row: Main Well Map */
.bottom-map-wrapper {
    flex: 1;
    position: relative;
    border: 1px solid #bbb;
    background: #e8e8e8;
    box-sizing: border-box;
}

#mapView, #mapShot, #indexMapView, #indexMapShot {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
}

#mapShot, #indexMapShot {
    display: none;
}

.well-card {
    box-sizing: border-box;
    border: 1px solid #bbb;
    padding: 4px 5px;
    background: white;
    font-size: 9px;
}

.well-title {
    height: 14px;
    margin-bottom: 2px;
    font-size: 10px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.no-data {
    font-size: 9px;
    color: #555;
}

.profile-wrap {
    display: flex;
    gap: 3px;
}

.depth-axis {
    position: relative;
    box-sizing: border-box;
    width: 32px;
    font-size: 8px;
    text-align: right;
    padding-right: 3px;
    border-right: 1px solid #777;
}

.depth-axis span {
    position: absolute;
    right: 3px;
    white-space: nowrap;
}

.log-column {
    flex: 1;
    box-sizing: border-box;
    border: 1px solid #333;
    background: #f0f0f0;
    overflow: hidden;
}

.interval {
    box-sizing: border-box;
    border-bottom: 1px solid #444;
    padding: 1px 2px;
    font-size: 8px;
    line-height: 1;
    overflow: hidden;
    color: #111;
}

.map-caption {
    height: 24px;
    flex: none;
    font-size: 9px;
    line-height: 1.2;
    overflow: hidden;
    color: #333;
}
</style>
</head>

<body>

<div id="controls">
    <label for="titleInput">Report Title:</label>
    <input type="text" id="titleInput" value="Lithology Report" oninput="updateReportTitles()">
    <button id="pdfBtn" onclick="downloadPDF()" disabled>Preparing report...</button>
</div>

<div id="report">
    <div class="pdf-page" id="page1">
        <!-- 1. Title Block -->
        <div class="report-header" id="pageHeaderEl">Lithology Report</div>

        <!-- 2. Middle Row: 8 Charts (Left) & Index Map (Right) -->
        <div class="middle-row">
            <div class="charts-container" id="wellGrid">
                <p style="font-size:11px; color:#555;">Loading wells...</p>
            </div>
            <div class="index-map-wrapper">
                <div id="indexMapView"></div>
                <img id="indexMapShot" alt="Index map inset">
            </div>
        </div>

        <!-- 3. Bottom Row: Main Well Map -->
        <div class="bottom-map-wrapper">
            <div id="mapView"></div>
            <img id="mapShot" alt="Well location map">
        </div>

        <div class="map-caption" id="mapCaption">Loading map data...</div>
    </div>
</div>

<script>
// ---------- Settings ----------
const MAX_WELLS = 8; // Configured for up to 8 charts on one page
const COMMON_SCALE = false;

const WELLS_LAYER_URL = "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/DwOpenData/MapServer/3";
const WELLS_ID_FIELD  = "WELLID";

const IMAGERY_URL = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer";
const TOPO_URL = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer";

const MIN_MAP_SPAN_M = 600;

// ---------- URL parameters ----------
const params = new URLSearchParams(window.location.search);
const wellsParam = params.get("wells") || params.get("well") || "";
const titleParam = params.get("title") || params.get("reportTitle") || "Lithology Report";

document.getElementById("titleInput").value = titleParam;
document.title = "FinalV1 - " + titleParam;

const allIds = wellsParam
    .split(",")
    .map(id => id.trim())
    .filter(id => id.length > 0);

const wellIds = [...new Set(allIds)].slice(0, MAX_WELLS);

const lithologyQueryUrl = "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/DwOpenData/MapServer/4/query";

function getCustomTitle(){
    const input = document.getElementById("titleInput");
    return input && input.value.trim() ? input.value.trim() : "Lithology Report";
}

function updateReportTitles(){
    const title = getCustomTitle();
    document.title = "FinalV1 - " + title;
    
    const headerEl = document.getElementById("pageHeaderEl");
    const n = wellIds.length;
    const truncatedNote = allIds.length > MAX_WELLS
        ? ` (first ${MAX_WELLS} of ${new Set(allIds).size} selected)`
        : "";

    if(headerEl){
        headerEl.textContent = `${title} - Dashboard (${n} well${n === 1 ? "" : "s"}${truncatedNote})`;
    }
}

function getColor(lithology){
    const lith = String(lithology || "").toLowerCase();

    if(lith.includes("sand")) return "#f4d03f";
    if(lith.includes("silt")) return "#c2b280";
    if(lith.includes("clay")) return "#a67c52";
    if(lith.includes("gravel")) return "#9e9e9e";
    if(lith.includes("till") || lith.includes("diamicton")) return "#b0c4de";
    if(
        lith.includes("rock") ||
        lith.includes("bedrock") ||
        lith.includes("limestone") ||
        lith.includes("shale") ||
        lith.includes("dolomite")
    ) return "#95a5a6";

    return "#d5d8dc";
}

// ======================================================
// CHARTS LOADING
// ======================================================
async function getLithology(wellId){
    const cleanId = String(wellId).trim();
    const whereClause = `WELLID='${cleanId.replaceAll("'","''")}'`;

    const queryParams = new URLSearchParams({
        f: "json",
        where: whereClause,
        outFields: "*",
        returnGeometry: "false",
        orderByFields: "SEQ_NUM"
    });

    try {
        const response = await fetch(`${lithologyQueryUrl}?${queryParams}`);
        const data = await response.json();

        if(!data.features || data.features.length === 0){
            return [];
        }

        return data.features
            .map(f => f.attributes)
            .sort((a,b) => Number(a.SEQ_NUM) - Number(b.SEQ_NUM));
    } catch (err) {
        console.error("Error fetching lithology data for well " + cleanId, err);
        return [];
    }
}

function rowsToIntervals(rows){
    return rows.map(row => {
        const bottomDepth = Number(row.DEPTH || row.Bottom || row.BOTTOM_DEPTH) || 0;
        const thickness = Number(row.THICKNESS || row.Thick) || 0;
        const topDepth = Math.max(bottomDepth - thickness, 0);
        const lithology = row.PRIM_LITH || row.LITHOLOGY || row.PRIMARY_LITH || row.LITH || "Unknown";

        return {
            topDepth,
            bottomDepth,
            thickness: Math.max(thickness, 1),
            lithology
        };
    });
}

function buildCard(wellId, intervals, cardW, chartH, depthForScale){
    const card = document.createElement("div");
    card.className = "well-card";
    card.style.width = cardW + "px";

    if(!intervals || intervals.length === 0){
        card.innerHTML = `
            <div class="well-title">Well ${wellId}</div>
            <div class="no-data">No data found.</div>`;
        return card;
    }

    const maxDepth = Math.max(...intervals.map(i => i.bottomDepth));
    const scale = depthForScale > 0 ? chartH / depthForScale : 1;
    const columnHeight = Math.max(Math.round(maxDepth * scale), 8);

    let intervalHtml = "";

    intervals.forEach(interval => {
        const height = interval.thickness * scale;
        const color = getColor(interval.lithology);
        const showLabel = height > 18;

        intervalHtml += `
        <div class="interval" style="height:${height}px; background:${color};">
            ${
                showLabel
                ? `<strong>${interval.topDepth}-${interval.bottomDepth}ft</strong><br>${interval.lithology}`
                : ""
            }
        </div>`;
    });

    card.innerHTML = `
        <div class="well-title">Well ${wellId}</div>
        <div class="profile-wrap">
            <div class="depth-axis" style="height:${columnHeight}px">
                <span style="top:0">0ft</span>
                <span style="top:${Math.max(columnHeight - 10, 10)}px">${maxDepth}ft</span>
            </div>
            <div class="log-column" style="height:${columnHeight}px">
                ${intervalHtml}
            </div>
        </div>`;

    return card;
}

async function loadReport(){
    const grid = document.getElementById("wellGrid");

    if(wellIds.length === 0){
        grid.innerHTML = "<p style='font-size:11px; color:#a00;'><strong>Error:</strong> No Well ID provided in URL parameters (e.g., <code>?wells=ID1,ID2</code>).</p>";
        return;
    }

    const allRows = await Promise.all(wellIds.map(getLithology));
    const allIntervals = allRows.map(rowsToIntervals);

    const cardW = 142; // Optimized width for 4 columns of cards
    const chartH = 120; // Optimized height for 2 rows of charts

    grid.innerHTML = "";

    wellIds.forEach((wellId, idx) => {
        const intervals = allIntervals[idx];
        const ownMax = intervals.length ? Math.max(...intervals.map(i => i.bottomDepth)) : 0;
        grid.appendChild(buildCard(wellId, intervals, cardW, chartH, ownMax));
    });
}

// ======================================================
// MAPS LOADING (Main Map & Index Map)
// ======================================================
function loadArcGIS(){
    return new Promise((resolve, reject) => {
        if(typeof require !== "function"){
            reject(new Error("ArcGIS Maps SDK did not load."));
            return;
        }
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/Basemap",
            "esri/layers/TileLayer",
            "esri/layers/GraphicsLayer",
            "esri/Graphic",
            "esri/geometry/Extent",
            "esri/rest/query",
            "esri/core/reactiveUtils"
        ], (Map, MapView, Basemap, TileLayer, GraphicsLayer, Graphic, Extent, query, reactiveUtils) => {
            resolve({ Map, MapView, Basemap, TileLayer, GraphicsLayer, Graphic, Extent, query, reactiveUtils });
        });
    });
}

function showMapMessage(text){
    document.getElementById("bottom-map-wrapper").innerHTML = `<div style="padding:12px; font-size:11px; color:#a00;">${text}</div>`;
}

async function loadMaps(){
    if(wellIds.length === 0) return;

    if(!WELLS_LAYER_URL || WELLS_LAYER_URL.startsWith("PASTE_")){
        showMapMessage("Map not generated: set WELLS_LAYER_URL.");
        return;
    }

    let view = null;
    let indexView = null;

    try {
        const {
            Map, MapView, Basemap, TileLayer, GraphicsLayer,
            Graphic, Extent, query, reactiveUtils
        } = await loadArcGIS();

        const where = `${WELLS_ID_FIELD} IN (${wellIds
            .map(id => `'${String(id).replaceAll("'", "''")}'`)
            .join(",")})`;

        const result = await query.executeQueryJSON(WELLS_LAYER_URL, {
            where,
            outFields: [WELLS_ID_FIELD],
            returnGeometry: true,
            outSpatialReference: { wkid: 102100 }
        });

        const features = result.features.filter(f => f.geometry);

        if(features.length === 0){
            showMapMessage("No matching wells found in layer.");
            return;
        }

        // --- 1. Main Map Setup ---
        const graphicsLayer = new GraphicsLayer();

        features.forEach(f => {
            const id = f.attributes[WELLS_ID_FIELD];

            graphicsLayer.add(new Graphic({
                geometry: f.geometry,
                symbol: {
                    type: "simple-marker",
                    style: "circle",
                    color: [230, 30, 30, 1],
                    size: 10,
                    outline: { color: [255, 255, 255, 1], width: 1.5 }
                }
            }));

            graphicsLayer.add(new Graphic({
                geometry: f.geometry,
                symbol: {
                    type: "text",
                    text: String(id),
                    color: [255, 255, 255, 1],
                    haloColor: [0, 0, 0, 1],
                    haloSize: "2px",
                    yoffset: 10,
                    font: { size: 10, weight: "bold" }
                }
            }));
        });

        const xs = features.map(f => f.geometry.x);
        const ys = features.map(f => f.geometry.y);

        let xmin = Math.min(...xs), xmax = Math.max(...xs);
        let ymin = Math.min(...ys), ymax = Math.max(...ys);

        const cx = (xmin + xmax) / 2;
        const cy = (ymin + ymax) / 2;
        const halfW = Math.max((xmax - xmin) / 2 * 1.4, MIN_MAP_SPAN_M / 2);
        const halfH = Math.max((ymax - ymin) / 2 * 1.4, MIN_MAP_SPAN_M / 2);

        const extent = new Extent({
            xmin: cx - halfW,
            xmax: cx + halfW,
            ymin: cy - halfH,
            ymax: cy + halfH,
            spatialReference: { wkid: 102100 }
        });

        const map = new Map({
            basemap: new Basemap({
                baseLayers: [ new TileLayer({ url: IMAGERY_URL }) ]
            }),
            layers: [ graphicsLayer ]
        });

        view = new MapView({
            container: "mapView",
            map,
            constraints: { snapToZoom: false },
            ui: { components: [] }
        });

        // --- 2. Index Map Setup (10x Area Scale) ---
        const indexGraphicsLayer = new GraphicsLayer();

        features.forEach(f => {
            indexGraphicsLayer.add(new Graphic({
                geometry: f.geometry,
                symbol: {
                    type: "simple-marker",
                    style: "circle",
                    color: [255, 255, 0, 1],
                    size: 6,
                    outline: { color: [0, 0, 0, 1], width: 1 }
                }
            }));
        });

        indexGraphicsLayer.add(new Graphic({
            geometry: extent,
            symbol: {
                type: "simple-fill",
                color: [255, 0, 0, 0.15],
                outline: { color: [255, 0, 0, 1], width: 2 }
            }
        }));

        const indexScaleFactor = 10;
        const indexExtent = new Extent({
            xmin: cx - (halfW * indexScaleFactor),
            xmax: cx + (halfW * indexScaleFactor),
            ymin: cy - (halfH * indexScaleFactor),
            ymax: cy + (halfH * indexScaleFactor),
            spatialReference: { wkid: 102100 }
        });

        const indexMap = new Map({
            basemap: new Basemap({
                baseLayers: [ new TileLayer({ url: TOPO_URL }) ]
            }),
            layers: [ indexGraphicsLayer ]
        });

        indexView = new MapView({
            container: "indexMapView",
            map: indexMap,
            constraints: { snapToZoom: false },
            ui: { components: [] }
        });

        await Promise.all([ view.when(), indexView.when() ]);
        
        await view.goTo(extent, { animate: false });
        await indexView.goTo(indexExtent, { animate: false });

        await reactiveUtils.whenOnce(() => view.stationary && indexView.stationary);
        await reactiveUtils.whenOnce(() => !view.updating && !indexView.updating);
        await new Promise(r => setTimeout(r, 800));

        const shot = await view.takeScreenshot({ format: "jpg", quality: 85 });
        const indexShot = await indexView.takeScreenshot({ format: "jpg", quality: 85 });
        
        const scaleText = Math.round(view.scale).toLocaleString();

        const img = document.getElementById("mapShot");
        img.src = shot.dataUrl;
        await img.decode();
        img.style.display = "block";
        document.getElementById("mapView").style.display = "none";

        const indexImg = document.getElementById("indexMapShot");
        indexImg.src = indexShot.dataUrl;
        await indexImg.decode();
        indexImg.style.display = "block";
        document.getElementById("indexMapView").style.display = "none";

        document.getElementById("mapCaption").innerHTML =
            `Selected wells (${features.length} of ${wellIds.length}): ${features.map(f => f.attributes[WELLS_ID_FIELD]).join(", ")} | Scale 1:${scaleText} | Imagery: Esri, Maxar, Earthstar Geographics`;

        view.destroy();
        indexView.destroy();
        view = null;
        indexView = null;

    } catch (err) {
        console.error("Map generation error:", err);
        showMapMessage("Map error: " + err.message);
        if(view){ try { view.destroy(); } catch(e){} }
        if(indexView){ try { indexView.destroy(); } catch(e){} }
    }
}

// ======================================================
// PDF EXPORT
// ======================================================
function downloadPDF(){
    html2pdf()
        .set({
            margin: 0.3,
            filename: "Lithology_Dashboard.pdf",
            image: { type: "jpeg", quality: 0.9 },
            html2canvas: { scale: 1.5, backgroundColor: "#ffffff", scrollY: 0, useCORS: true },
            jsPDF: { unit: "in", format: "letter", orientation: "landscape" }
        })
        .from(document.getElementById("report"))
        .save();
}

async function init(){
    const btn = document.getElementById("pdfBtn");

    updateReportTitles();
    await Promise.all([ loadReport(), loadMaps() ]);

    btn.disabled = wellIds.length === 0;
    btn.textContent = "Download PDF";
}

init();
</script>

</body>
</html>
