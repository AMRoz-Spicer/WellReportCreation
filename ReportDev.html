<style>

<body>

<div id="controls">
    <label for="titleInput">Title:</label>
    <input type="text" id="titleInput" value="Lithology Report" oninput="updateReportTitles()">
    <label for="driveInput">Drive-time layer (item ID or layer URL):</label>
    <input type="text" id="driveInput" placeholder="Paste the saved drive-time layer item ID or URL">
    <button id="driveBtn" onclick="applyDriveLayer()">Apply</button>
    <label for="minutesInput">Or generate drive times (min):</label>
    <input type="text" id="minutesInput" value="15,30,45" style="width:90px; padding:6px 10px; font-size:13px; border:1px solid #888; border-radius:3px;">
    <button id="genDriveBtn" onclick="generateDriveAreas()">Generate</button>
    <button id="pdfBtn" onclick="downloadPDF()" disabled>Preparing report...</button>
</div>

<div id="report">
    <!-- Dynamic Landscape Pages injected here -->
</div>

<script>
// ---------- Settings ----------
const WELLS_PER_PAGE = 3; 

const WELLS_LAYER_URL = "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/DwOpenData/MapServer/3";
const WELLS_ID_FIELD  = "WELLID";

const IMAGERY_URL = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer";
const TOPO_URL = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer";

const MIN_MAP_SPAN_M = 600;

// Hardcoded Wetland Layer URL
const WETLAND_LAYER_URL = "https://services3.arcgis.com/dxRQUfTDNtfqZ301/arcgis/rest/services/EGLE_Part303StateWetlandInventory/FeatureServer/0";

// ---------- Drive-time areas ----------
// Two ways to get drive-time areas on the report map:
//
// 1) GENERATE during report creation (type minutes in the controls bar and click Generate, or
//    add ?driveMins=15,30,45 to the link). The page calls the ArcGIS service area service from the
//    mean center of each page's wells. Needs an API key with ROUTING privileges (ArcGIS Online >
//    Content > New item > Developer credentials). Restrict the key to your GitHub Pages URL.
//    Credits are charged to the account that owns the key.
//
// 2) LOAD a layer saved from the Experience Builder tool: ?drive=<item ID or layer URL>
//    (optionally &driveWhere=<SQL filter>). That layer must be shared with Everyone.
//
// If both are set, the generated areas win.
const API_KEY = "";
const SERVICE_AREA_URL = "https://route-api.arcgis.com/arcgis/rest/services/World/ServiceAreas/NAServer/ServiceArea_World/solveServiceArea";
const DEFAULT_BREAKS = [15, 30, 45];

// Fill colors for each break, smallest to largest (cycles if there are more breaks)
const DRIVE_COLORS = [
    [0, 170, 0, 0.45],
    [255, 200, 0, 0.45],
    [230, 60, 0, 0.45],
    [150, 0, 150, 0.45],
    [0, 90, 200, 0.45]
];

const PARCEL_LAYER_URLS = [
    "https://services5.arcgis.com/nax8we6GhQgsO77P/arcgis/rest/services/Clinton_Parcels_2024_with_data/FeatureServer/0",
    "https://services.arcgis.com/edGXqVKidagzAIPB/arcgis/rest/services/2023_Eaton_County_Parcels/FeatureServer/87",
    "https://services3.arcgis.com/ySzhFSJfYeginRjx/arcgis/rest/services/Ingham_Parcels_2026/FeatureServer/0",
    "https://services.arcgis.com/edGXqVKidagzAIPB/arcgis/rest/services/Ionia_County_Parcels/FeatureServer/3",
    "https://gis.mijackson.org/countygis/rest/services/ParcelViewer/Parcels/FeatureServer/0",
    "https://services7.arcgis.com/zssqyzc5LZ9oAgzn/arcgis/rest/services/Shiawassee_Parcel_PEA/FeatureServer/0",
    "https://services1.arcgis.com/4ezfu5dIwH83BUNL/arcgis/rest/services/Washtenaw_County_Parcel_Data/FeatureServer/0"
];

const polygonRenderer = {
    type: "simple",
    symbol: {
        type: "simple-fill",
        color: [0, 0, 0, 0],
        outline: { color: [0, 0, 0, 1], width: 1.25 }
    }
};

// ---------- URL Parameters ----------
const params = new URLSearchParams(window.location.search);
const wellsParam = params.get("wells") || params.get("well") || "";
const titleParam = params.get("title") || params.get("reportTitle") || "Lithology Report";
const DRIVE_WHERE = (params.get("driveWhere") || "").trim();

function parseBreaks(text){
    const list = String(text || "").split(/[ ,;]+/).map(Number).filter(n => n > 0 && isFinite(n));
    return [...new Set(list)].sort((a, b) => a - b);
}

// Current drive-time settings (changed by the Apply and Generate buttons)
let driveLayerParam = (params.get("drive") || "").trim();
let generateBreaks = params.get("driveMins") ? parseBreaks(params.get("driveMins")) : null;
if (generateBreaks && generateBreaks.length === 0) generateBreaks = null;
let reportRunning = false;

document.getElementById("titleInput").value = titleParam;
document.getElementById("driveInput").value = driveLayerParam;
if (generateBreaks) document.getElementById("minutesInput").value = generateBreaks.join(",");
document.title = "FinalV1 - " + titleParam;

const allIds = wellsParam.split(",").map(id => id.trim()).filter(id => id.length > 0);
const uniqueWellIds = [...new Set(allIds)];
const totalSections = Math.max(Math.ceil(uniqueWellIds.length / WELLS_PER_PAGE), 1);

const lithologyQueryUrl = "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/DwOpenData/MapServer/4/query";

function getCustomTitle(){
    const input = document.getElementById("titleInput");
    return input && input.value.trim() ? input.value.trim() : "Lithology Report";
}

// Rebuilds the report using the saved drive-time layer typed into the controls bar
function applyDriveLayer(){
    if (reportRunning) return;
    driveLayerParam = document.getElementById("driveInput").value.trim();
    generateBreaks = null; // the pasted layer replaces any generated areas
    initReport();
}

// Rebuilds the report and generates drive-time areas for the minutes typed into the controls bar
function generateDriveAreas(){
    if (reportRunning) return;
    if (!API_KEY) {
        alert("Set API_KEY near the top of Report.html (an API key with routing privileges) to generate drive-time areas here.");
        return;
    }
    const breaks = parseBreaks(document.getElementById("minutesInput").value);
    if (breaks.length === 0) {
        alert("Enter one or more drive times in minutes, e.g. 15,30,45");
        return;
    }
    generateBreaks = breaks;
    initReport();
}

function updateReportTitles(){
    const title = getCustomTitle();
    document.title = "FinalV1 - " + title;
    
    uniqueWellIds.forEach((_, sectionIdx) => {
        const start = sectionIdx * WELLS_PER_PAGE + 1;
        const end = Math.min((sectionIdx + 1) * WELLS_PER_PAGE, uniqueWellIds.length);
        
        const header1 = document.getElementById(`pageHeaderEl_p1_${sectionIdx}`);
        if(header1) header1.textContent = `${title} - Charts & Well Map (Wells ${start}-${end} of ${uniqueWellIds.length}) [Section ${sectionIdx + 1} of ${totalSections}]`;

        const header2 = document.getElementById(`pageHeaderEl_p2_${sectionIdx}`);
        if(header2) header2.textContent = `${title} - Wetlands, Drive-Time Areas, Contours & Data Calculations [Section ${sectionIdx + 1} of ${totalSections}]`;
    });
}

function getColor(lithology){
    const lith = String(lithology || "").toLowerCase();
    if(lith.includes("sand")) return "#f4d03f";
    if(lith.includes("silt")) return "#c2b280";
    if(lith.includes("clay")) return "#a67c52";
    if(lith.includes("gravel")) return "#9e9e9e";
    if(lith.includes("till") || lith.includes("diamicton")) return "#b0c4de";
    if(lith.includes("rock") || lith.includes("bedrock") || lith.includes("limestone") || lith.includes("shale") || lith.includes("dolomite")) return "#95a5a6";
    return "#d5d8dc";
}

function buildLegend(){
    const items = [
        ["#f4d03f", "Sand"],
        ["#c2b280", "Silt"],
        ["#a67c52", "Clay"],
        ["#9e9e9e", "Gravel"],
        ["#b0c4de", "Till"],
        ["#95a5a6", "Bedrock"],
        ["#d5d8dc", "Other"]
    ];
    return items.map(([color, label]) => `<div class="legend-item"><span class="swatch" style="background:${color}"></span>${label}</div>`).join("");
}

// ======================================================
// LITHOLOGY FETCHING
// ======================================================
async function fetchAllLithology(wellIdsList){
    if (!wellIdsList || wellIdsList.length === 0) return {};
    const cleanIds = wellIdsList.map(id => `'${String(id).replaceAll("'","''")}'`);
    const whereClause = cleanIds.length === 1 ? `${WELLS_ID_FIELD} = ${cleanIds[0]}` : `${WELLS_ID_FIELD} IN (${cleanIds.join(",")})`;

    const queryParams = new URLSearchParams({
        f: "json", where: whereClause, outFields: "*", returnGeometry: "false", orderByFields: `${WELLS_ID_FIELD}, SEQ_NUM`
    });

    try {
        const response = await fetch(`${lithologyQueryUrl}?${queryParams}`);
        const data = await response.json();
        const map = {};
        wellIdsList.forEach(id => map[id] = []);
        if(data.features){
            data.features.forEach(f => {
                const attr = f.attributes;
                const id = String(attr[WELLS_ID_FIELD] || attr.WELLID || "").trim();
                if(map[id]) map[id].push(attr);
            });
        }
        return map;
    } catch (err) {
        console.error("Error fetching batched lithology data:", err);
        return {};
    }
}

function rowsToIntervals(rows){
    const rawIntervals = (rows || []).map(row => {
        const bottomDepth = Number(row.DEPTH || row.Bottom || row.BOTTOM_DEPTH) || 0;
        const thickness = Number(row.THICKNESS || row.Thick) || 0;
        const topDepth = Math.max(bottomDepth - thickness, 0);
        const lithology = row.PRIM_LITH || row.LITHOLOGY || row.PRIMARY_LITH || row.LITH || "Unknown";
        return { topDepth, bottomDepth, thickness: Math.max(thickness, 1), lithology };
    });

    const merged = [];
    rawIntervals.forEach(curr => {
        const last = merged[merged.length - 1];
        if (last && last.lithology.toLowerCase() === curr.lithology.toLowerCase()) {
            last.bottomDepth = curr.bottomDepth;
            last.thickness = last.bottomDepth - last.topDepth;
        } else {
            merged.push({ ...curr });
        }
    });
    return merged;
}

function buildCard(wellId, intervals, chartH, depthForScale){
    const card = document.createElement("div");
    card.className = "well-card";

    if(!intervals || intervals.length === 0){
        card.innerHTML = `<div class="well-title">Well ${wellId}</div><div class="no-data">No lithology data found.</div>`;
        return card;
    }

    const maxDepth = Math.max(...intervals.map(i => i.bottomDepth));
    const scale = depthForScale > 0 ? chartH / depthForScale : 1;
    const columnHeight = Math.max(Math.round(maxDepth * scale), 6);
    const rawHeights = intervals.map(i => i.thickness * scale);
    const MIN_LAYER_PX = 12;
    let totalDeficit = 0;
    let thickLayerIndices = [];

    rawHeights.forEach((h, idx) => {
        if (h < MIN_LAYER_PX) totalDeficit += (MIN_LAYER_PX - h);
        else thickLayerIndices.push(idx);
    });

    const totalThickPx = thickLayerIndices.reduce((sum, idx) => sum + rawHeights[idx], 0);
    const finalHeights = rawHeights.map((h, idx) => {
        if (h < MIN_LAYER_PX) return MIN_LAYER_PX;
        else if (thickLayerIndices.includes(idx) && totalThickPx > 0) {
            const shareOfDeficit = (h / totalThickPx) * totalDeficit;
            return Math.max(MIN_LAYER_PX, h - shareOfDeficit);
        }
        return h;
    });

    let intervalHtml = "", sideLabelsHtml = "", currentTopPx = 0;
    intervals.forEach((interval, idx) => {
        const height = finalHeights[idx];
        const color = getColor(interval.lithology);
        sideLabelsHtml += `<div class="side-label-absolute" style="top:${currentTopPx}px; height:${height}px;" title="${interval.topDepth}-${interval.bottomDepth}ft: ${interval.lithology}"><strong>${interval.topDepth}-${interval.bottomDepth}ft</strong>: ${interval.lithology}</div>`;
        intervalHtml += `<div class="interval" style="top:${currentTopPx}px; height:${height}px; background:${color};"></div>`;
        currentTopPx += height;
    });

    card.innerHTML = `
        <div class="well-title">Well ${wellId}</div>
        <div class="card-body-split">
            <div class="side-labels-column" style="height:${columnHeight}px;">${sideLabelsHtml}</div>
            <div class="profile-wrap">
                <div class="depth-axis" style="height:${columnHeight}px">
                    <span style="top:0">0ft</span>
                    <span style="top:${Math.max(columnHeight - 8, 4)}px">${maxDepth}ft</span>
                </div>
                <div class="log-column" style="height:${columnHeight}px">${intervalHtml}</div>
            </div>
        </div>`;
    return card;
}

// ======================================================
// ARCGIS MAPS, AUTOMATED ACREAGE & DRIVE-TIME HELPERS
// ======================================================
function loadArcGIS(){
    return new Promise((resolve, reject) => {
        if(typeof require !== "function"){ reject(new Error("ArcGIS SDK missing.")); return; }
        require([
            "esri/Map", "esri/views/MapView", "esri/Basemap", "esri/layers/TileLayer", "esri/layers/FeatureLayer", 
            "esri/layers/GraphicsLayer", "esri/Graphic", "esri/geometry/Extent", "esri/geometry/geometryEngine", "esri/rest/query",
            "esri/core/reactiveUtils", "esri/config", "esri/rest/serviceArea", "esri/rest/support/ServiceAreaParameters", "esri/rest/support/FeatureSet"
        ], (Map, MapView, Basemap, TileLayer, FeatureLayer, GraphicsLayer, Graphic, Extent, geometryEngine, query,
            reactiveUtils, esriConfig, serviceArea, ServiceAreaParameters, FeatureSet) => {
            resolve({ Map, MapView, Basemap, TileLayer, FeatureLayer, GraphicsLayer, Graphic, Extent, geometryEngine, query,
                      reactiveUtils, esriConfig, serviceArea, ServiceAreaParameters, FeatureSet });
        });
    });
}

// Automated Mean Center Helper (marks the middle of the selected wells)
function calculateMeanCenter(sectionFeatures, arcgisSdk) {
    if (!sectionFeatures || sectionFeatures.length === 0) return null;
    let sumX = 0, sumY = 0;
    sectionFeatures.forEach(f => { sumX += f.geometry.x; sumY += f.geometry.y; });
    return new arcgisSdk.Graphic({
        geometry: { type: "point", x: sumX / sectionFeatures.length, y: sumY / sectionFeatures.length, spatialReference: { wkid: 102100 } },
        symbol: { type: "simple-marker", style: "cross", color: [255, 140, 0, 1], size: 12, outline: { color: [0, 0, 0, 1], width: 2 } }
    });
}

// Automated Bounding Extent Helper (for Contour Area of Interest)
function calculateContourExtent(sectionFeatures, arcgisSdk) {
    if (!sectionFeatures || sectionFeatures.length === 0) return null;
    const geometries = sectionFeatures.map(f => f.geometry);
    const unionedGeom = arcgisSdk.geometryEngine.union(geometries);
    const bufferedAoi = arcgisSdk.geometryEngine.buffer(unionedGeom, 500, "meters");
    return new arcgisSdk.Graphic({
        geometry: bufferedAoi,
        symbol: { type: "simple-fill", color: [0, 255, 0, 0.05], outline: { color: [0, 180, 0, 1], width: 1.5, style: "dash" } }
    });
}

// Loads the drive-time layer the user saved from the app (item ID or layer URL).
// Returns { layer, breaks, extent } or null if it can't be read.
async function loadSavedDriveLayer(arcgisSdk){
    const { FeatureLayer } = arcgisSdk;
    const source = /^https?:/i.test(driveLayerParam)
        ? { url: driveLayerParam }
        : { portalItem: { id: driveLayerParam } };

    const layer = new FeatureLayer({ ...source, opacity: 0.8, outFields: ["*"] });
    if (DRIVE_WHERE) layer.definitionExpression = DRIVE_WHERE;
    await layer.load();

    let breaks = [];
    const breakField = layer.fields.find(f => f.name.toLowerCase() === "tobreak");

    if (breakField) {
        const distinct = await layer.queryFeatures({
            where: "1=1",
            outFields: [breakField.name],
            returnDistinctValues: true,
            returnGeometry: false
        });
        breaks = [...new Set(distinct.features.map(f => Number(f.attributes[breakField.name])))]
            .filter(v => !isNaN(v))
            .sort((a, b) => a - b);

        layer.renderer = {
            type: "unique-value",
            field: breakField.name,
            uniqueValueInfos: breaks.map((value, i) => ({
                value: value,
                label: String(value),
                symbol: {
                    type: "simple-fill",
                    color: DRIVE_COLORS[i % DRIVE_COLORS.length],
                    outline: { color: [60, 60, 60, 1], width: 1 }
                }
            })),
            defaultSymbol: { type: "simple-fill", color: [150, 150, 150, 0.4], outline: { color: [60, 60, 60, 1], width: 1 } }
        };
        // Draw the largest area first so the smaller ones stay visible on top
        layer.orderBy = [{ field: breakField.name, order: "descending" }];
    } else {
        layer.renderer = {
            type: "simple",
            symbol: { type: "simple-fill", color: [255, 100, 0, 0.35], outline: { color: [200, 50, 0, 1], width: 1 } }
        };
    }

    let extent = null;
    try {
        const ext = await layer.queryExtent();
        if (ext && ext.count > 0 && ext.extent) extent = ext.extent;
    } catch (e) { console.warn("Could not get drive-time layer extent:", e); }

    return { layer, breaks, extent };
}

// Generates drive-time areas from the mean center with the ArcGIS service area service
async function generateFallbackDriveAreas(meanCenterGraphic, arcgisSdk, targetLayer, breaks){
    const { esriConfig, serviceArea, ServiceAreaParameters, FeatureSet, Graphic } = arcgisSdk;
    esriConfig.apiKey = API_KEY;

    const saParams = new ServiceAreaParameters({
        facilities: new FeatureSet({ features: [ new Graphic({ geometry: meanCenterGraphic.geometry }) ] }),
        defaultBreaks: breaks,
        trimOuterPolygon: true,
        outSpatialReference: { wkid: 102100 }
    });

    const result = await serviceArea.solve(SERVICE_AREA_URL, saParams);
    const polys = (result.serviceAreaPolygons && result.serviceAreaPolygons.features) || [];

    polys
        .sort((a, b) => b.attributes.ToBreak - a.attributes.ToBreak) // largest first, smallest on top
        .forEach(feat => {
            const idx = Math.max(breaks.indexOf(feat.attributes.ToBreak), 0);
            targetLayer.add(new Graphic({
                geometry: feat.geometry,
                symbol: {
                    type: "simple-fill",
                    color: DRIVE_COLORS[idx % DRIVE_COLORS.length],
                    outline: { color: [60, 60, 60, 1], width: 1 }
                }
            }));
        });

    return polys.length;
}

async function calculateParcelAcreage(sectionFeatures, arcgisSdk) {
    if (sectionFeatures.length === 0) return null;
    try {
        const parcelSummary = [];
        const processedWellIds = new Set();

        for (const feature of sectionFeatures) {
            const wellId = String(feature.attributes[WELLS_ID_FIELD]);
            if (processedWellIds.has(wellId)) continue;

            const bufferedPoint = arcgisSdk.geometryEngine.buffer(feature.geometry, 1, "meters");
            let foundParcel = false;

            for (const url of PARCEL_LAYER_URLS) {
                if (foundParcel) break;
                try {
                    const parcelResults = await arcgisSdk.query.executeQueryJSON(url, {
                        geometry: bufferedPoint || feature.geometry,
                        spatialRelationship: "intersects",
                        outFields: ["*"],
                        returnGeometry: true,
                        outSpatialReference: { wkid: 102100 }
                    });

                    if (parcelResults.features && parcelResults.features.length > 0) {
                        const parcel = parcelResults.features[0];
                        const areaAcres = arcgisSdk.geometryEngine.geodesicArea(parcel.geometry, "acres");
                        parcelSummary.push({
                            wellId: wellId,
                            acres: areaAcres && areaAcres > 0 ? areaAcres.toFixed(2) : "0.00"
                        });
                        processedWellIds.add(wellId);
                        foundParcel = true;
                    }
                } catch (e) {}
            }
        }
        return parcelSummary;
    } catch (err) {
        return null;
    }
}

async function renderSectionMaps(sectionIdx, sectionWellIds, allFeatures){
    const mainViewDivId = `mapView_main_${sectionIdx}`;
    const mainShotImgId = `mapShot_main_${sectionIdx}`;
    const mainCaptionId = `mapCaption_main_${sectionIdx}`;

    const truckViewDivId = `mapView_truck_${sectionIdx}`;
    const truckShotImgId = `mapShot_truck_${sectionIdx}`;
    const truckCaptionId = `mapCaption_truck_${sectionIdx}`;

    const wetlandViewDivId = `mapView_wetland_${sectionIdx}`;
    const wetlandShotImgId = `mapShot_wetland_${sectionIdx}`;
    const wetlandCaptionId = `mapCaption_wetland_${sectionIdx}`;

    const contourViewDivId = `mapView_contour_${sectionIdx}`;
    const contourShotImgId = `mapShot_contour_${sectionIdx}`;
    const contourCaptionId = `mapCaption_contour_${sectionIdx}`;

    const calcFormContainerId = `calcFormContainer_${sectionIdx}`;

    const sectionFeatures = allFeatures.filter(f => sectionWellIds.includes(String(f.attributes[WELLS_ID_FIELD])));
    if(sectionFeatures.length === 0) return;

    let mainView = null, truckView = null, wetlandView = null, contourView = null;

    try {
        const arcgis = await loadArcGIS();
        const { Map, MapView, Basemap, TileLayer, FeatureLayer, GraphicsLayer, Graphic, Extent, reactiveUtils } = arcgis;

        // --- 1. MAIN WELL MAP (Page 1) ---
        const mainGraphicsLayer = new GraphicsLayer();
        allFeatures.forEach(f => {
            const id = f.attributes[WELLS_ID_FIELD];
            const isCurrentSection = sectionWellIds.includes(String(id));
            if (isCurrentSection) {
                mainGraphicsLayer.add(new Graphic({ geometry: f.geometry, symbol: { type: "simple-marker", style: "circle", color: [230, 30, 30, 1], size: 10, outline: { color: [255, 255, 255, 1], width: 1.5 } } }));
                mainGraphicsLayer.add(new Graphic({ geometry: f.geometry, symbol: { type: "text", text: String(id), color: [255, 255, 255, 1], haloColor: [0, 0, 0, 1], haloSize: "2px", yoffset: 10, font: { size: 9, weight: "bold" } } }));
            } else {
                mainGraphicsLayer.add(new Graphic({ geometry: f.geometry, symbol: { type: "simple-marker", style: "circle", color: [140, 140, 140, 0.8], size: 7, outline: { color: [255, 255, 255, 0.8], width: 1 } } }));
            }
        });

        const xs = sectionFeatures.map(f => f.geometry.x);
        const ys = sectionFeatures.map(f => f.geometry.y);
        let xmin = Math.min(...xs), xmax = Math.max(...xs);
        let ymin = Math.min(...ys), ymax = Math.max(...ys);
        const cx = (xmin + xmax) / 2, cy = (ymin + ymax) / 2;
        const halfW = Math.max((xmax - xmin) / 2 * 1.5, MIN_MAP_SPAN_M / 2);
        const halfH = Math.max((ymax - ymin) / 2 * 1.5, MIN_MAP_SPAN_M / 2);

        const mainExtent = new Extent({ xmin: cx - halfW, xmax: cx + halfW, ymin: cy - halfH, ymax: cy + halfH, spatialReference: { wkid: 102100 } });

        const mainMap = new Map({
            basemap: new Basemap({ baseLayers: [ new TileLayer({ url: IMAGERY_URL }) ] }),
            layers: [
                new FeatureLayer({ url: PARCEL_LAYER_URLS[0], renderer: polygonRenderer }),
                new FeatureLayer({ url: PARCEL_LAYER_URLS[1], renderer: polygonRenderer }),
                new FeatureLayer({ url: PARCEL_LAYER_URLS[2], renderer: polygonRenderer }),
                new FeatureLayer({ url: PARCEL_LAYER_URLS[3], renderer: polygonRenderer }),
                new FeatureLayer({ url: PARCEL_LAYER_URLS[4], renderer: polygonRenderer }),
                new FeatureLayer({ url: PARCEL_LAYER_URLS[5], renderer: polygonRenderer }),
                new FeatureLayer({ url: PARCEL_LAYER_URLS[6], renderer: polygonRenderer }),
                mainGraphicsLayer
            ]
        });

        mainView = new MapView({ container: mainViewDivId, map: mainMap, constraints: { snapToZoom: false }, ui: { components: [] } });

        // --- 2. DRIVE-TIME MAP (Top-Right Quadrant) ---
        // Wells and mean center always draw; the drive-time areas come from the saved layer
        // (?drive=...) or, if no layer was supplied and API_KEY is set, from the service area fallback.
        const truckGraphicsLayer = new GraphicsLayer();
        const truckMapLayers = [];
        let truckExtent = new Extent({ xmin: cx - (halfW * 12), xmax: cx + (halfW * 12), ymin: cy - (halfH * 12), ymax: cy + (halfH * 12), spatialReference: { wkid: 102100 } });
        let truckCaptionText = "No drive-time areas yet. Enter minutes and click Generate, or paste a saved layer ID above.";

        const meanCenterGraphic = calculateMeanCenter(sectionFeatures, arcgis);

        if (generateBreaks && API_KEY && meanCenterGraphic) {
            try {
                const count = await generateFallbackDriveAreas(meanCenterGraphic, arcgis, truckGraphicsLayer, generateBreaks);
                truckCaptionText = count > 0
                    ? `Drive-Time Areas from well center (${generateBreaks.join(", ")} min)`
                    : "No drive-time areas returned for this location.";
            } catch (saErr) {
                console.warn("Service area request failed:", saErr);
                truckCaptionText = "Drive-time generation failed (check the API key and routing privileges).";
            }
        } else if (driveLayerParam) {
            try {
                const drive = await loadSavedDriveLayer(arcgis);
                truckMapLayers.push(drive.layer);
                if (drive.extent) truckExtent = drive.extent.clone().expand(1.15);
                truckCaptionText = drive.breaks.length
                    ? `Drive-Time Areas (break values: ${drive.breaks.join(", ")})`
                    : "Drive-Time Areas";
            } catch (driveErr) {
                console.warn("Could not load the drive-time layer. Check the item ID/URL and that it is shared with Everyone:", driveErr);
                truckCaptionText = "Drive-time layer could not be loaded (check the ID/URL and sharing).";
            }
        }

        sectionFeatures.forEach(f => {
            truckGraphicsLayer.add(new Graphic({ geometry: f.geometry, symbol: { type: "simple-marker", style: "circle", color: [255, 255, 0, 1], size: 7, outline: { color: [0, 0, 0, 1], width: 1 } } }));
        });
        if (meanCenterGraphic) truckGraphicsLayer.add(meanCenterGraphic);
        truckMapLayers.push(truckGraphicsLayer);

        const truckMap = new Map({
            basemap: new Basemap({ baseLayers: [ new TileLayer({ url: TOPO_URL }) ] }),
            layers: truckMapLayers
        });

        truckView = new MapView({ container: truckViewDivId, map: truckMap, constraints: { snapToZoom: false }, ui: { components: [] } });

        // --- 3. WETLAND MAP (Top-Left Quadrant - Unique Value Symbology) ---
        const wetlandLayers = [];
        if (WETLAND_LAYER_URL && !WETLAND_LAYER_URL.includes("your-gis-server")) {
            const wetlandRenderer = {
                type: "unique-value",
                field: "Symbology",
                uniqueValueInfos: [
                    {
                        value: "5; 3; 7",
                        symbol: { type: "simple-fill", color: [140, 150, 50, 0.4], style: "backward-diagonal", outline: { color: [0, 100, 0, 1], width: 1 } },
                        label: "Wetlands as identified on NWI and MIRIS maps and soil areas which include wetland soils"
                    },
                    {
                        value: "2; 4; 6",
                        symbol: { type: "simple-fill", color: [112, 168, 48, 0.6], outline: { color: [50, 100, 20, 1], width: 1 } },
                        label: "Wetlands as identified on NWI and MIRIS maps"
                    },
                    {
                        value: "1",
                        symbol: { type: "simple-fill", color: [168, 112, 48, 0.6], outline: { color: [100, 60, 20, 1], width: 1 } },
                        label: "Soil areas which include wetland soils"
                    }
                ],
                defaultSymbol: { type: "simple-fill", color: [200, 200, 200, 0.3], outline: { color: [100, 100, 100, 1], width: 0.5 } }
            };

            wetlandLayers.push(new FeatureLayer({ url: WETLAND_LAYER_URL, renderer: wetlandRenderer }));
        }
        const wetlandGraphicsLayer = new GraphicsLayer();
        sectionFeatures.forEach(f => {
            wetlandGraphicsLayer.add(new Graphic({ geometry: f.geometry, symbol: { type: "simple-marker", style: "circle", color: [0, 150, 255, 1], size: 8, outline: { color: [255, 255, 255, 1], width: 1.5 } } }));
        });
        wetlandLayers.push(wetlandGraphicsLayer);

        const wetlandMap = new Map({
            basemap: new Basemap({ baseLayers: [ new TileLayer({ url: IMAGERY_URL }) ] }),
            layers: wetlandLayers
        });

        wetlandView = new MapView({ container: wetlandViewDivId, map: wetlandMap, constraints: { snapToZoom: false }, ui: { components: [] } });

        // --- 4. CONTOUR MAP (Bottom-Left Quadrant - Automated Extent Polygon) ---
        const contourGraphicsLayer = new GraphicsLayer();
        const contourExtentGraphic = calculateContourExtent(sectionFeatures, arcgis);
        if(contourExtentGraphic) contourGraphicsLayer.add(contourExtentGraphic);

        sectionFeatures.forEach(f => {
            contourGraphicsLayer.add(new Graphic({ geometry: f.geometry, symbol: { type: "simple-marker", style: "circle", color: [50, 180, 50, 1], size: 8, outline: { color: [255, 255, 255, 1], width: 1.5 } } }));
        });

        const contourMap = new Map({
            basemap: new Basemap({ baseLayers: [ new TileLayer({ url: TOPO_URL }) ] }),
            layers: [ contourGraphicsLayer ]
        });

        contourView = new MapView({ container: contourViewDivId, map: contourMap, constraints: { snapToZoom: false }, ui: { components: [] } });

        // --- RENDER VIEWS ---
        await Promise.all([ mainView.when(), truckView.when(), wetlandView.when(), contourView.when() ]);
        
        await mainView.goTo(mainExtent, { animate: false });
        await truckView.goTo(truckExtent, { animate: false });
        await wetlandView.goTo(mainExtent, { animate: false });
        await contourView.goTo(mainExtent, { animate: false });

        const mapReadyPromise = Promise.all([
            reactiveUtils.whenOnce(() => mainView.stationary && truckView.stationary && wetlandView.stationary && contourView.stationary),
            reactiveUtils.whenOnce(() => !mainView.updating && !truckView.updating && !wetlandView.updating && !contourView.updating)
        ]);
        // Wait up to 60 seconds for all layers to finish drawing before taking the screenshots
        await Promise.race([mapReadyPromise, new Promise(resolve => setTimeout(resolve, 60000))]);

        const mainShot = await mainView.takeScreenshot({ format: "jpg", quality: 100 });
        const truckShot = await truckView.takeScreenshot({ format: "jpg", quality: 100 });
        const wetlandShot = await wetlandView.takeScreenshot({ format: "jpg", quality: 100 });
        const contourShot = await contourView.takeScreenshot({ format: "jpg", quality: 100 });

        // Inject Images
        const setImg = (id, shot, viewDivId, captionId, captionText) => {
            const img = document.getElementById(id);
            img.src = shot.dataUrl;
            img.style.display = "block";
            document.getElementById(viewDivId).style.display = "none";
            document.getElementById(captionId).textContent = captionText;
        };

        setImg(mainShotImgId, mainShot, mainViewDivId, mainCaptionId, `Section Wells: ${sectionFeatures.map(f => f.attributes[WELLS_ID_FIELD]).join(", ")} | Scale 1:${Math.round(mainView.scale).toLocaleString()}`);
        setImg(truckShotImgId, truckShot, truckViewDivId, truckCaptionId, truckCaptionText);
        setImg(wetlandShotImgId, wetlandShot, wetlandViewDivId, wetlandCaptionId, `Wetland Analysis Layer`);
        setImg(contourShotImgId, contourShot, contourViewDivId, contourCaptionId, `2ft Contour Map Template`);

        // --- CALCULATIONS FORM CONTAINER (Bottom-Right Quadrant - Automated Acreage) ---
        const parcelData = await calculateParcelAcreage(sectionFeatures, arcgis);
        const calcContainer = document.getElementById(calcFormContainerId);
        
        let totalCalculatedAcres = 0;
        let rowsHtml = "";
        if (parcelData && parcelData.length > 0) {
            totalCalculatedAcres = parcelData.reduce((sum, p) => sum + (parseFloat(p.acres) || 0), 0);
            rowsHtml = parcelData.map(p => `<tr><td><strong>Well ${p.wellId}</strong></td><td>${p.acres} Acres</td></tr>`).join("");
        }

        calcContainer.innerHTML = `
            <div class="calc-form-container">
                <table class="acreage-table">
                    <thead><tr><th>Well ID</th><th>Enclosing Parcel Area</th></tr></thead>
                    <tbody>${rowsHtml || '<tr><td colspan="2">No enclosing parcels detected.</td></tr>'}</tbody>
                </table>
                <div class="calc-row">
                    <label>Acreage (Auto):</label>
                    <input type="text" id="inputAcreage_${sectionIdx}" value="${totalCalculatedAcres.toFixed(2)}" readonly style="background:#eee; font-weight:bold;">
                </div>
                <div class="calc-row">
                    <label>Total Price ($):</label>
                    <input type="text" id="inputPrice_${sectionIdx}" value="0.00" oninput="updateCalculations(${sectionIdx})">
                </div>
                <div class="calc-row">
                    <label>Price Per Acre ($):</label>
                    <input type="text" id="inputPricePerAcre_${sectionIdx}" value="0.00" readonly style="background:#eee; font-weight:bold;">
                </div>
            </div>
        `;

        mainView.destroy(); truckView.destroy(); wetlandView.destroy(); contourView.destroy();
    } catch (err) {
        console.error("Map generation error on section " + sectionIdx, err);
    }
}

// Live calculation script for Price Per Acre using auto-calculated acreage
function updateCalculations(idx) {
    const acres = parseFloat(document.getElementById(`inputAcreage_${idx}`).value) || 0;
    const price = parseFloat(document.getElementById(`inputPrice_${idx}`).value.replace(/[^0-9.-]+/g,"")) || 0;
    const pricePerAcreInput = document.getElementById(`inputPricePerAcre_${idx}`);

    if (acres > 0) {
        const perAcre = price / acres;
        pricePerAcreInput.value = "$" + perAcre.toFixed(2);
    } else {
        pricePerAcreInput.value = "$0.00";
    }
}

async function initReport(){
    const reportContainer = document.getElementById("report");
    const btn = document.getElementById("pdfBtn");

    reportRunning = true;
    btn.disabled = true;
    btn.textContent = "Preparing report...";
    document.getElementById("driveBtn").disabled = true;
    document.getElementById("genDriveBtn").disabled = true;

    if(uniqueWellIds.length === 0){
        reportContainer.innerHTML = "<p style='padding:20px; font-size:12px; color:#a00;'><strong>Error:</strong> No Well ID provided in URL parameters.</p>";
        return;
    }

    reportContainer.innerHTML = "";

    for(let sectionIdx = 0; sectionIdx < totalSections; sectionIdx++){
        // --- PAGE 1: Charts & Main Well Map ---
        const page1Div = document.createElement("div");
        page1Div.className = "pdf-page";
        page1Div.id = `page1_${sectionIdx}`;
        page1Div.innerHTML = `
            <div class="report-header" id="pageHeaderEl_p1_${sectionIdx}">Lithology Report</div>
            <div class="charts-section">
                <div class="charts-container" id="wellGrid_${sectionIdx}"><p style="font-size:10px; color:#555; padding:6px;">Loading charts...</p></div>
                <div class="legend-box">${buildLegend()}</div>
            </div>
            <div class="main-map-section">
                <div class="map-wrapper">
                    <div class="map-view-div" id="mapView_main_${sectionIdx}"></div>
                    <img class="map-shot-img" id="mapShot_main_${sectionIdx}" alt="Main map">
                </div>
                <div class="map-caption" id="mapCaption_main_${sectionIdx}">Loading map data...</div>
            </div>
        `;
        reportContainer.appendChild(page1Div);

        // --- PAGE 2: 4-Quadrant Layout ---
        const page2Div = document.createElement("div");
        page2Div.className = "pdf-page";
        page2Div.id = `page2_${sectionIdx}`;
        page2Div.innerHTML = `
            <div class="report-header" id="pageHeaderEl_p2_${sectionIdx}">Lithology Report - Wetlands, Drive-Time Areas, Contours & Data Calculations</div>
            <div class="page2-grid-section">
                <!-- Quadrant 1: Wetlands Map -->
                <div class="quadrant-box">
                    <div class="quadrant-title">Wetlands Analysis Map</div>
                    <div class="map-wrapper">
                        <div class="map-view-div" id="mapView_wetland_${sectionIdx}"></div>
                        <img class="map-shot-img" id="mapShot_wetland_${sectionIdx}" alt="Wetlands map">
                    </div>
                    <div class="map-caption" id="mapCaption_wetland_${sectionIdx}">Loading wetlands...</div>
                </div>

                <!-- Quadrant 2: Drive-Time Areas Map -->
                <div class="quadrant-box">
                    <div class="quadrant-title">Drive-Time Areas</div>
                    <div class="map-wrapper">
                        <div class="map-view-div" id="mapView_truck_${sectionIdx}"></div>
                        <img class="map-shot-img" id="mapShot_truck_${sectionIdx}" alt="Drive-time areas map">
                    </div>
                    <div class="map-caption" id="mapCaption_truck_${sectionIdx}">Loading drive-time areas...</div>
                </div>

                <!-- Quadrant 3: 2ft Contour Map -->
                <div class="quadrant-box">
                    <div class="quadrant-title">2ft Contour Map</div>
                    <div class="map-wrapper">
                        <div class="map-view-div" id="mapView_contour_${sectionIdx}"></div>
                        <img class="map-shot-img" id="mapShot_contour_${sectionIdx}" alt="Contour map">
                    </div>
                    <div class="map-caption" id="mapCaption_contour_${sectionIdx}">Loading contours...</div>
                </div>

                <!-- Quadrant 4: Data Calculations Form & Acreage Summary -->
                <div class="quadrant-box">
                    <div class="quadrant-title">Data Calculations & Pricing Summary</div>
                    <div id="calcFormContainer_${sectionIdx}">
                        <p style="font-size:10px; color:#555;">Calculating values...</p>
                    </div>
                </div>
            </div>
        `;
        reportContainer.appendChild(page2Div);
    }

    updateReportTitles();

    let lithologyMap = {}, allFeatures = [];
    try {
        const [lithMap, arcgisSdk] = await Promise.all([ fetchAllLithology(uniqueWellIds), loadArcGIS() ]);
        lithologyMap = lithMap;

        const cleanIds = uniqueWellIds.map(id => `'${String(id).replaceAll("'", "''")}'`);
        const where = cleanIds.length === 1 ? `${WELLS_ID_FIELD} = ${cleanIds[0]}` : `${WELLS_ID_FIELD} IN (${cleanIds.join(",")})`;

        const result = await arcgisSdk.query.executeQueryJSON(WELLS_LAYER_URL, { where, outFields: [WELLS_ID_FIELD], returnGeometry: true, outSpatialReference: { wkid: 102100 } });
        allFeatures = result.features || [];
    } catch (err) {
        console.error("Error fetching report data:", err);
    }

    const sectionPromises = [];
    for(let sectionIdx = 0; sectionIdx < totalSections; sectionIdx++){
        const start = sectionIdx * WELLS_PER_PAGE;
        const sectionWellIds = uniqueWellIds.slice(start, start + WELLS_PER_PAGE);

        const sectionTask = (async () => {
            try {
                const grid = document.getElementById(`wellGrid_${sectionIdx}`);
                const chartH = 290;
                grid.innerHTML = "";
                sectionWellIds.forEach(wellId => {
                    const rowsData = lithologyMap[wellId] || [];
                    const intervals = rowsToIntervals(rowsData);
                    const ownMax = intervals.length ? Math.max(...intervals.map(i => i.bottomDepth)) : 0;
                    grid.appendChild(buildCard(wellId, intervals, chartH, ownMax));
                });

                await renderSectionMaps(sectionIdx, sectionWellIds, allFeatures);
            } catch (secErr) {
                console.error(`Error rendering section ${sectionIdx}:`, secErr);
            }
        })();
        sectionPromises.push(sectionTask);
    }

    await Promise.all(sectionPromises);
    btn.disabled = false;
    btn.textContent = "Download PDF";
    document.getElementById("driveBtn").disabled = false;
    document.getElementById("genDriveBtn").disabled = false;
    reportRunning = false;
}

function downloadPDF(){
    const rawTitle = getCustomTitle();
    const safeFilename = rawTitle.replace(/[^a-zA-Z0-9-_]/g, "_") + "_Landscape.pdf";

    html2pdf()
        .set({
            margin: 0,
            filename: safeFilename,
            image: { type: "jpeg", quality: 1.0 },
            html2canvas: { scale: 2.0, backgroundColor: "#ffffff", scrollY: 0, useCORS: true },
            jsPDF: { unit: "in", format: "letter", orientation: "landscape" }
        })
        .from(document.getElementById("report"))
        .save();
}
