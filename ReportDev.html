<body>

<div id="controls">
    <label for="titleInput">Report Title:</label>
    <input type="text" id="titleInput" value="Lithology Report" oninput="updateReportTitles()">
    <button id="pdfBtn" onclick="downloadPDF()" disabled>Preparing report...</button>
</div>

<div id="report">
    <!-- Dynamic Landscape Pages injected here -->
</div>

<script>
// ---------- Settings ----------
const WELLS_PER_PAGE = 3; // Exactly 3 charts per landscape page

const WELLS_LAYER_URL = "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/DwOpenData/MapServer/3";
const WELLS_ID_FIELD  = "WELLID";

const IMAGERY_URL = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer";
const TOPO_URL = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer";

const MIN_MAP_SPAN_M = 600;

// ---------- PARCEL FEATURE LAYER URL FOR ACREAGE CALCULATIONS ----------
const PARCEL_LAYER_URL = "YOUR_PARCEL_FEATURE_LAYER_URL/0"; 

// ---------- URL Parameters ----------
const params = new URLSearchParams(window.location.search);
const wellsParam = params.get("wells") || params.get("well") || "";
const titleParam = params.get("title") || params.get("reportTitle") || "Lithology Report";

document.getElementById("titleInput").value = titleParam;
document.title = "FinalV1 - " + titleParam;

const allIds = wellsParam
    .split(",")
    .map(id => id.trim())
    .filter(id => id.length > 0);

const uniqueWellIds = [...new Set(allIds)];
const totalSections = Math.max(Math.ceil(uniqueWellIds.length / WELLS_PER_PAGE), 1);

const lithologyQueryUrl = "https://gisagoegle.state.mi.us/arcgis/rest/services/EGLE/DwOpenData/MapServer/4/query";

function getCustomTitle(){
    const input = document.getElementById("titleInput");
    return input && input.value.trim() ? input.value.trim() : "Lithology Report";
}

function updateReportTitles(){
    const title = getCustomTitle();
    document.title = "FinalV1 - " + title;
    
    uniqueWellIds.forEach((_, sectionIdx) => {
        const start = sectionIdx * WELLS_PER_PAGE + 1;
        const end = Math.min((sectionIdx + 1) * WELLS_PER_PAGE, uniqueWellIds.length);
        
        const header1 = document.getElementById(`pageHeaderEl_p1_${sectionIdx}`);
        if(header1){
            header1.textContent = `${title} - Charts & Well Map (Wells ${start}-${end} of ${uniqueWellIds.length}) [Section ${sectionIdx + 1} of ${totalSections}]`;
        }

        const header2 = document.getElementById(`pageHeaderEl_p2_${sectionIdx}`);
        if(header2){
            header2.textContent = `${title} - Context Map & Parcel Acreage Analysis (Wells ${start}-${end} of ${uniqueWellIds.length}) [Section ${sectionIdx + 1} of ${totalSections}]`;
        }
    });
}

function getColor(lithology){
    const lith = String(lithology || "").toLowerCase();

    if(lith.includes("sand")) return "#f4d03f";
    if(lith.includes("silt")) return "#c2b280";
    if(lith.includes("clay")) return "#a67c52";
    if(lith.includes("gravel")) return "#9e9e9e";
    if(lith.includes("till") || lith.includes("diamicton")) return "#b0c4de";
    if(
        lith.includes("rock") ||
        lith.includes("bedrock") ||
        lith.includes("limestone") ||
        lith.includes("shale") ||
        lith.includes("dolomite")
    ) return "#95a5a6";

    return "#d5d8dc";
}

function buildLegend(){
    const items = [
        ["#f4d03f", "Sand"],
        ["#c2b280", "Silt"],
        ["#a67c52", "Clay"],
        ["#9e9e9e", "Gravel"],
        ["#b0c4de", "Till"],
        ["#95a5a6", "Bedrock"],
        ["#d5d8dc", "Other"]
    ];

    return items.map(([color, label]) =>
        `<div class="legend-item"><span class="swatch" style="background:${color}"></span>${label}</div>`
    ).join("");
}

// ======================================================
// BATCHED LITHOLOGY FETCHING & LAYER MERGING
// ======================================================
async function fetchAllLithology(wellIdsList){
    if (!wellIdsList || wellIdsList.length === 0) return {};

    const cleanIds = wellIdsList.map(id => `'${String(id).replaceAll("'","''")}'`);
    const whereClause = cleanIds.length === 1 
        ? `${WELLS_ID_FIELD} = ${cleanIds[0]}` 
        : `${WELLS_ID_FIELD} IN (${cleanIds.join(",")})`;

    const queryParams = new URLSearchParams({
        f: "json",
        where: whereClause,
        outFields: "*",
        returnGeometry: "false",
        orderByFields: `${WELLS_ID_FIELD}, SEQ_NUM`
    });

    try {
        const response = await fetch(`${lithologyQueryUrl}?${queryParams}`);
        const data = await response.json();

        const map = {};
        wellIdsList.forEach(id => map[id] = []);

        if(data.features){
            data.features.forEach(f => {
                const attr = f.attributes;
                const id = String(attr[WELLS_ID_FIELD] || attr.WELLID || "").trim();
                if(map[id]){
                    map[id].push(attr);
                } else {
                    for (let key of wellIdsList) {
                        if (String(key).trim() === id) {
                            map[key].push(attr);
                            break;
                        }
                    }
                }
            });
        }
        return map;
    } catch (err) {
        console.error("Error fetching batched lithology data:", err);
        return {};
    }
}

function rowsToIntervals(rows){
    const rawIntervals = (rows || []).map(row => {
        const bottomDepth = Number(row.DEPTH || row.Bottom || row.BOTTOM_DEPTH) || 0;
        const thickness = Number(row.THICKNESS || row.Thick) || 0;
        const topDepth = Math.max(bottomDepth - thickness, 0);
        const lithology = row.PRIM_LITH || row.LITHOLOGY || row.PRIMARY_LITH || row.LITH || "Unknown";

        return {
            topDepth,
            bottomDepth,
            thickness: Math.max(thickness, 1),
            lithology
        };
    });

    const merged = [];
    rawIntervals.forEach(curr => {
        const last = merged[merged.length - 1];
        if (last && last.lithology.toLowerCase() === curr.lithology.toLowerCase()) {
            last.bottomDepth = curr.bottomDepth;
            last.thickness = last.bottomDepth - last.topDepth;
        } else {
            merged.push({ ...curr });
        }
    });
    return merged;
}

function buildCard(wellId, intervals, chartH, depthForScale){
    const card = document.createElement("div");
    card.className = "well-card";

    if(!intervals || intervals.length === 0){
        card.innerHTML = `
            <div class="well-title">Well ${wellId}</div>
            <div class="no-data">No lithology data found.</div>`;
        return card;
    }

    const maxDepth = Math.max(...intervals.map(i => i.bottomDepth));
    const scale = depthForScale > 0 ? chartH / depthForScale : 1;
    const columnHeight = Math.max(Math.round(maxDepth * scale), 6);

    const rawHeights = intervals.map(i => i.thickness * scale);
    const MIN_LAYER_PX = 12;
    let totalDeficit = 0;
    let thickLayerIndices = [];

    rawHeights.forEach((h, idx) => {
        if (h < MIN_LAYER_PX) {
            totalDeficit += (MIN_LAYER_PX - h);
        } else {
            thickLayerIndices.push(idx);
        }
    });

    const totalThickPx = thickLayerIndices.reduce((sum, idx) => sum + rawHeights[idx], 0);

    const finalHeights = rawHeights.map((h, idx) => {
        if (h < MIN_LAYER_PX) {
            return MIN_LAYER_PX;
        } else if (thickLayerIndices.includes(idx) && totalThickPx > 0) {
            const shareOfDeficit = (h / totalThickPx) * totalDeficit;
            return Math.max(MIN_LAYER_PX, h - shareOfDeficit);
        }
        return h;
    });

    let intervalHtml = "";
    let sideLabelsHtml = "";
    let currentTopPx = 0;

    intervals.forEach((interval, idx) => {
        const height = finalHeights[idx];
        const color = getColor(interval.lithology);

        sideLabelsHtml += `<div class="side-label-absolute" style="top:${currentTopPx}px; height:${height}px;" title="${interval.topDepth}-${interval.bottomDepth}ft: ${interval.lithology}"><strong>${interval.topDepth}-${interval.bottomDepth}ft</strong>: ${interval.lithology}</div>`;

        intervalHtml += `
        <div class="interval" style="top:${currentTopPx}px; height:${height}px; background:${color};"></div>`;

        currentTopPx += height;
    });

    card.innerHTML = `
        <div class="well-title">Well ${wellId}</div>
        <div class="card-body-split">
            <div class="side-labels-column" style="height:${columnHeight}px;">
                ${sideLabelsHtml}
            </div>
            <div class="profile-wrap">
                <div class="depth-axis" style="height:${columnHeight}px">
                    <span style="top:0">0ft</span>
                    <span style="top:${Math.max(columnHeight - 8, 4)}px">${maxDepth}ft</span>
                </div>
                <div class="log-column" style="height:${columnHeight}px">
                    ${intervalHtml}
                </div>
            </div>
        </div>`;

    return card;
}

// ======================================================
// ARCGIS MAPS & ACREAGE CALCULATION ENGINE
// ======================================================
function loadArcGIS(){
    return new Promise((resolve, reject) => {
        if(typeof require !== "function"){
            reject(new Error("ArcGIS Maps SDK did not load."));
            return;
        }
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/Basemap",
            "esri/layers/TileLayer",
            "esri/layers/FeatureLayer",
            "esri/layers/GraphicsLayer",
            "esri/Graphic",
            "esri/geometry/Extent",
            "esri/geometry/geometryEngine",
            "esri/rest/query",
            "esri/core/reactiveUtils"
        ], (Map, MapView, Basemap, TileLayer, FeatureLayer, GraphicsLayer, Graphic, Extent, geometryEngine, query, reactiveUtils) => {
            resolve({ Map, MapView, Basemap, TileLayer, FeatureLayer, GraphicsLayer, Graphic, Extent, geometryEngine, query, reactiveUtils });
        });
    });
}

// Spatially query parcel geometries for the section wells and calculate acreage
async function calculateParcelAcreage(sectionFeatures, arcgisSdk) {
    if (!PARCEL_LAYER_URL || PARCEL_LAYER_URL.includes("YOUR_PARCEL") || sectionFeatures.length === 0) {
        return null;
    }

    try {
        const wellGeometries = sectionFeatures.map(f => f.geometry);
        
        const parcelResults = await arcgisSdk.query.executeQueryJSON(PARCEL_LAYER_URL, {
            geometry: wellGeometries[0], // Spatial intersect check
            spatialRelationship: "intersects",
            outFields: ["*"],
            returnGeometry: true,
            outSpatialReference: { wkid: 102100 }
        });

        if (!parcelResults.features || parcelResults.features.length === 0) {
            return [];
        }

        const parcelSummary = parcelResults.features.map((parcel, idx) => {
            const areaAcres = arcgisSdk.geometryEngine.geodesicArea(parcel.geometry, "acres");
            const attrs = parcel.attributes;
            const parcelId = attrs.PARCEL_ID || attrs.PIN || attrs.TAXID || attrs.OBJECTID || `Parcel #${idx + 1}`;
            
            return {
                id: parcelId,
                acres: areaAcres > 0 ? areaAcres.toFixed(2) : "N/A"
            };
        });

        return parcelSummary;
    } catch (err) {
        console.warn("Parcel acreage calculation skipped/error:", err);
        return null;
    }
}

async function renderSectionMaps(sectionIdx, sectionWellIds, allFeatures){
    const mainViewDivId = `mapView_main_${sectionIdx}`;
    const mainShotImgId = `mapShot_main_${sectionIdx}`;
    const mainCaptionId = `mapCaption_main_${sectionIdx}`;

    const indexViewDivId = `mapView_index_${sectionIdx}`;
    const indexShotImgId = `mapShot_index_${sectionIdx}`;
    const indexCaptionId = `mapCaption_index_${sectionIdx}`;
    const acreageContainerId = `acreageContainer_${sectionIdx}`;

    const sectionFeatures = allFeatures.filter(f => sectionWellIds.includes(String(f.attributes[WELLS_ID_FIELD])));

    if(sectionFeatures.length === 0){
        document.getElementById(mainCaptionId).textContent = "No matching well locations for this section.";
        document.getElementById(indexCaptionId).textContent = "No matching regional context for this section.";
        return;
    }

    let mainView = null;
    let indexView = null;

    try {
        const arcgis = await loadArcGIS();
        const { Map, MapView, Basemap, TileLayer, FeatureLayer, GraphicsLayer, Graphic, Extent, reactiveUtils } = arcgis;

        // --- PAGE 1 MAIN MAP ---
        const mainGraphicsLayer = new GraphicsLayer();

        allFeatures.forEach(f => {
            const id = f.attributes[WELLS_ID_FIELD];
            const isCurrentSection = sectionWellIds.includes(String(id));

            if (isCurrentSection) {
                mainGraphicsLayer.add(new Graphic({
                    geometry: f.geometry,
                    symbol: {
                        type: "simple-marker",
                        style: "circle",
                        color: [230, 30, 30, 1],
                        size: 10,
                        outline: { color: [255, 255, 255, 1], width: 1.5 }
                    }
                }));

                mainGraphicsLayer.add(new Graphic({
                    geometry: f.geometry,
                    symbol: {
                        type: "text",
                        text: String(id),
                        color: [255, 255, 255, 1],
                        haloColor: [0, 0, 0, 1],
                        haloSize: "2px",
                        yoffset: 10,
                        font: { size: 9, weight: "bold" }
                    }
                }));
            } else {
                mainGraphicsLayer.add(new Graphic({
                    geometry: f.geometry,
                    symbol: {
                        type: "simple-marker",
                        style: "circle",
                        color: [140, 140, 140, 0.8],
                        size: 7,
                        outline: { color: [255, 255, 255, 0.8], width: 1 }
                    }
                }));
            }
        });

        const xs = sectionFeatures.map(f => f.geometry.x);
        const ys = sectionFeatures.map(f => f.geometry.y);

        let xmin = Math.min(...xs), xmax = Math.max(...xs);
        let ymin = Math.min(...ys), ymax = Math.max(...ys);

        const cx = (xmin + xmax) / 2;
        const cy = (ymin + ymax) / 2;
        const halfW = Math.max((xmax - xmin) / 2 * 1.5, MIN_MAP_SPAN_M / 2);
        const halfH = Math.max((ymax - ymin) / 2 * 1.5, MIN_MAP_SPAN_M / 2);

        const mainExtent = new Extent({
            xmin: cx - halfW,
            xmax: cx + halfW,
            ymin: cy - halfH,
            ymax: cy + halfH,
            spatialReference: { wkid: 102100 }
        });

        // Polygon Renderer with NO FILL and BLACK OUTLINES
        const polygonRenderer = {
            type: "simple",
            symbol: {
                type: "simple-fill",
                color: [0, 0, 0, 0], // Transparent / No fill
                outline: {
                    color: [0, 0, 0, 1], // Pure black outline
                    width: 1.25
                }
            }
        };

        // ======================================================
        // FEATURE CLASSES (LAYERS) SECTION
        // ======================================================
        // Polygon Renderer with NO FILL and BLACK OUTLINES
        const polygonRenderer = {
            type: "simple",
            symbol: {
                type: "simple-fill",
                color: [0, 0, 0, 0], // Transparent / No fill
                outline: {
                    color: [0, 0, 0, 1], // Pure black outline
                    width: 1.25
                }
            }
        };

        const mainMap = new Map({
            basemap: new Basemap({
                baseLayers: [ new TileLayer({ url: IMAGERY_URL }) ]
            }),
            layers: [
                new FeatureLayer({ url: "https://services5.arcgis.com/nax8we6GhQgsO77P/arcgis/rest/services/Clinton_Parcels_2024_with_data/FeatureServer/0", renderer: polygonRenderer }),
                new FeatureLayer({ url: "https://services.arcgis.com/edGXqVKidagzAIPB/arcgis/rest/services/2023_Eaton_County_Parcels/FeatureServer/87", renderer: polygonRenderer }),
                new FeatureLayer({ url: "https://services3.arcgis.com/ySzhFSJfYeginRjx/arcgis/rest/services/Ingham_Parcels_2026/FeatureServer/0", renderer: polygonRenderer }),
                new FeatureLayer({ url: "https://services.arcgis.com/edGXqVKidagzAIPB/arcgis/rest/services/Ionia_County_Parcels/FeatureServer/3", renderer: polygonRenderer }),
                new FeatureLayer({ url: "https://gis.mijackson.org/countygis/rest/services/ParcelViewer/Parcels/FeatureServer/0", renderer: polygonRenderer }),
                new FeatureLayer({ url: "https://services7.arcgis.com/zssqyzc5LZ9oAgzn/arcgis/rest/services/Shiawassee_Parcel_PEA/FeatureServer/0", renderer: polygonRenderer }),
                new FeatureLayer({ url: "https://services1.arcgis.com/4ezfu5dIwH83BUNL/arcgis/rest/services/Washtenaw_County_Parcel_Data/FeatureServer/0", renderer: polygonRenderer }),
                mainGraphicsLayer
            ]
        });
        mainView = new MapView({
            container: mainViewDivId,
            map: mainMap,
            constraints: { snapToZoom: false },
            ui: { components: [] }
        });

        // --- PAGE 2 INDEX MAP ---
        const indexGraphicsLayer = new GraphicsLayer();

        sectionFeatures.forEach(f => {
            indexGraphicsLayer.add(new Graphic({
                geometry: f.geometry,
                symbol: {
                    type: "simple-marker",
                    style: "circle",
                    color: [255, 255, 0, 1],
                    size: 7,
                    outline: { color: [0, 0, 0, 1], width: 1 }
                }
            }));
        });

        indexGraphicsLayer.add(new Graphic({
            geometry: mainExtent,
            symbol: {
                type: "simple-fill",
                color: [255, 0, 0, 0.15],
                outline: { color: [255, 0, 0, 1], width: 2 }
            }
        }));

        const indexScaleFactor = 12;
        const indexExtent = new Extent({
            xmin: cx - (halfW * indexScaleFactor),
            xmax: cx + (halfW * indexScaleFactor),
            ymin: cy - (halfH * indexScaleFactor),
            ymax: cy + (halfH * indexScaleFactor),
            spatialReference: { wkid: 102100 }
        });

        const indexMap = new Map({
            basemap: new Basemap({
                baseLayers: [ new TileLayer({ url: TOPO_URL }) ]
            }),
            layers: [ indexGraphicsLayer ]
        });

        indexView = new MapView({
            container: indexViewDivId,
            map: indexMap,
            constraints: { snapToZoom: false },
            ui: { components: [] }
        });

        await Promise.all([ mainView.when(), indexView.when() ]);
        
        await mainView.goTo(mainExtent, { animate: false });
        await indexView.goTo(indexExtent, { animate: false });

        const mapReadyPromise = Promise.all([
            reactiveUtils.whenOnce(() => mainView.stationary && indexView.stationary),
            reactiveUtils.whenOnce(() => !mainView.updating && !indexView.updating)
        ]);
        const timeoutPromise = new Promise(resolve => setTimeout(resolve, 8000));
        await Promise.race([mapReadyPromise, timeoutPromise]);

        const mainShot = await mainView.takeScreenshot({ format: "jpg", quality: 100 });
        const indexShot = await indexView.takeScreenshot({ format: "jpg", quality: 100 });
        
        const mainScaleText = Math.round(mainView.scale).toLocaleString();
        const indexScaleText = Math.round(indexView.scale).toLocaleString();

        const mainImg = document.getElementById(mainShotImgId);
        mainImg.src = mainShot.dataUrl;
        await mainImg.decode();
        mainImg.style.display = "block";
        document.getElementById(mainViewDivId).style.display = "none";

        const indexImg = document.getElementById(indexShotImgId);
        indexImg.src = indexShot.dataUrl;
        await indexImg.decode();
        indexImg.style.display = "block";
        document.getElementById(indexViewDivId).style.display = "none";

        document.getElementById(mainCaptionId).innerHTML =
            `Section Wells (${sectionFeatures.length}): ${sectionFeatures.map(f => f.attributes[WELLS_ID_FIELD]).join(", ")} | Scale 1:${mainScaleText} | Imagery: Esri, Maxar`;

        document.getElementById(indexCaptionId).innerHTML =
            `Regional Index Context | Scale 1:${indexScaleText} | Topographic Basemap`;

        // Calculate Parcel Acreage & Render Table
        const parcelData = await calculateParcelAcreage(sectionFeatures, arcgis);
        const acreageDiv = document.getElementById(acreageContainerId);
        
        if (parcelData && parcelData.length > 0) {
            let totalAcres = parcelData.reduce((sum, p) => sum + (parseFloat(p.acres) || 0), 0);
            let rowsHtml = parcelData.map(p => `
                <tr>
                    <td><strong>${p.id}</strong></td>
                    <td>${p.acres} Acres</td>
                </tr>
            `).join("");

            acreageDiv.innerHTML = `
                <div class="table-header-title">Intersecting Parcel Acreage Summary</div>
                <table class="acreage-table">
                    <thead>
                        <tr>
                            <th>Parcel ID / Tax PIN</th>
                            <th>Calculated Area</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rowsHtml}
                    </tbody>
                </table>
                <div class="summary-card">
                    <strong>Total Combined Acreage:</strong> ${totalAcres.toFixed(2)} Acres<br>
                    <strong>Wells Evaluated:</strong> ${sectionWellIds.join(", ")}
                </div>
            `;
        } else {
            acreageDiv.innerHTML = `
                <div class="table-header-title">Intersecting Parcel Acreage Summary</div>
                <div class="summary-card">
                    <strong>Parcel Analysis:</strong> No enclosing parcel polygon dataset detected for section wells [${sectionWellIds.join(", ")}].
                </div>
            `;
        }

        mainView.destroy();
        indexView.destroy();

    } catch (err) {
        console.error("Map generation error on section " + sectionIdx, err);
        document.getElementById(mainCaptionId).textContent = "Map rendered with fallback.";
        document.getElementById(indexCaptionId).textContent = "Index map rendered with fallback.";
        if (mainView) { try { mainView.destroy(); } catch(e){} }
        if (indexView) { try { indexView.destroy(); } catch(e){} }
    }
}

// ======================================================
// MAIN INITIALIZER
// ======================================================
async function initReport(){
    const reportContainer = document.getElementById("report");
    const btn = document.getElementById("pdfBtn");

    if(uniqueWellIds.length === 0){
        reportContainer.innerHTML = "<p style='padding:20px; font-size:12px; color:#a00;'><strong>Error:</strong> No Well ID provided in URL parameters.</p>";
        return;
    }

    reportContainer.innerHTML = "";

    for(let sectionIdx = 0; sectionIdx < totalSections; sectionIdx++){
        // --- PAGE 1 LANDSCAPE: Charts & Main Well Map ---
        const page1Div = document.createElement("div");
        page1Div.className = "pdf-page";
        page1Div.id = `page1_${sectionIdx}`;
        page1Div.innerHTML = `
            <div class="report-header" id="pageHeaderEl_p1_${sectionIdx}">Lithology Report</div>
            <div class="charts-section">
                <div class="charts-container" id="wellGrid_${sectionIdx}">
                    <p style="font-size:10px; color:#555; padding:6px;">Loading charts...</p>
                </div>
                <div class="legend-box">${buildLegend()}</div>
            </div>
            <div class="main-map-section">
                <div class="map-wrapper">
                    <div class="map-view-div" id="mapView_main_${sectionIdx}"></div>
                    <img class="map-shot-img" id="mapShot_main_${sectionIdx}" alt="Main well location map">
                </div>
                <div class="map-caption" id="mapCaption_main_${sectionIdx}">Loading map data...</div>
            </div>
        `;
        reportContainer.appendChild(page1Div);

        // --- PAGE 2 LANDSCAPE: Split 50/50 Map & Parcel Acreage Table ---
        const page2Div = document.createElement("div");
        page2Div.className = "pdf-page";
        page2Div.id = `page2_${sectionIdx}`;
        page2Div.innerHTML = `
            <div class="report-header" id="pageHeaderEl_p2_${sectionIdx}">Lithology Report - Context Map & Acreage</div>
            <div class="page2-split-section">
                <div class="page2-left-map">
                    <div class="map-wrapper">
                        <div class="map-view-div" id="mapView_index_${sectionIdx}"></div>
                        <img class="map-shot-img" id="mapShot_index_${sectionIdx}" alt="Regional index map">
                    </div>
                    <div class="map-caption" id="mapCaption_index_${sectionIdx}">Loading regional context...</div>
                </div>
                <div class="page2-right-table" id="acreageContainer_${sectionIdx}">
                    <p style="font-size:10px; color:#555;">Calculating parcel acreage for section wells...</p>
                </div>
            </div>
        `;
        reportContainer.appendChild(page2Div);
    }

    updateReportTitles();

    let lithologyMap = {};
    let allFeatures = [];

    try {
        const [lithMap, arcgisSdk] = await Promise.all([
            fetchAllLithology(uniqueWellIds),
            loadArcGIS()
        ]);
        lithologyMap = lithMap;

        const cleanIds = uniqueWellIds.map(id => `'${String(id).replaceAll("'", "''")}'`);
        const where = cleanIds.length === 1 
            ? `${WELLS_ID_FIELD} = ${cleanIds[0]}` 
            : `${WELLS_ID_FIELD} IN (${cleanIds.join(",")})`;

        const result = await arcgisSdk.query.executeQueryJSON(WELLS_LAYER_URL, {
            where,
            outFields: [WELLS_ID_FIELD],
            returnGeometry: true,
            outSpatialReference: { wkid: 102100 }
        });
        allFeatures = result.features || [];
    } catch (err) {
        console.error("Error fetching report data:", err);
    }

    const sectionPromises = [];
    for(let sectionIdx = 0; sectionIdx < totalSections; sectionIdx++){
        const start = sectionIdx * WELLS_PER_PAGE;
        const sectionWellIds = uniqueWellIds.slice(start, start + WELLS_PER_PAGE);

        const sectionTask = (async () => {
            try {
                const grid = document.getElementById(`wellGrid_${sectionIdx}`);
                const chartH = 290; // Fixed chart height for landscape letter fit

                grid.innerHTML = "";
                sectionWellIds.forEach(wellId => {
                    const rowsData = lithologyMap[wellId] || [];
                    const intervals = rowsToIntervals(rowsData);
                    const ownMax = intervals.length ? Math.max(...intervals.map(i => i.bottomDepth)) : 0;
                    grid.appendChild(buildCard(wellId, intervals, chartH, ownMax));
                });

                await renderSectionMaps(sectionIdx, sectionWellIds, allFeatures);
            } catch (secErr) {
                console.error(`Error rendering section ${sectionIdx}:`, secErr);
            }
        })();

        sectionPromises.push(sectionTask);
    }

    await Promise.all(sectionPromises);

    btn.disabled = false;
    btn.textContent = "Download PDF";
}

// ======================================================
// LANDSCAPE PDF EXPORT
// ======================================================
function downloadPDF(){
    const rawTitle = getCustomTitle();
    const safeFilename = rawTitle.replace(/[^a-zA-Z0-9-_]/g, "_") + "_Landscape.pdf";

    html2pdf()
        .set({
            margin: 0,
            filename: safeFilename,
            image: { type: "jpeg", quality: 1.0 },
            html2canvas: { scale: 2.0, backgroundColor: "#ffffff", scrollY: 0, useCORS: true },
            jsPDF: { unit: "in", format: "letter", orientation: "landscape" }
        })
        .from(document.getElementById("report"))
        .save();
}

initReport();
</script>
